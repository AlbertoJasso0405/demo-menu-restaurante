<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¡Gracias por tu Pedido! - Sabor & Fuego</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-H5MXSF5M7S"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-H5MXSF5M7S');

    // Evento de Conversión en Analytics al llegar a esta página
    gtag('event', 'conversion_page_view', {
      'page_title': 'Página de Gracias'
    });
  </script>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #e63946;
      --secondary: #1d3557;
      --bg-light: #f8f9fa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-light);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card-thanks {
      background: white;
      max-width: 500px;
      width: 100%;
      border-radius: 16px;
      padding: 40px 25px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .icon-check {
      width: 80px;
      height: 80px;
      background-color: #e8f5e9;
      color: #2e7d32;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 20px;
    }

    h1 {
      color: var(--secondary);
      font-size: 1.8rem;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .btn-return {
      display: inline-block;
      background-color: var(--primary);
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-return:hover {
      background-color: #d62839;
    }
  </style>
</head>
<body>

  <div class="card-thanks">
    <div class="icon-check">
      <i class="fas fa-check"></i>
    </div>
    <h1>¡Gracias por tu pedido!</h1>
    <p>Tu orden ha sido enviada a nuestro WhatsApp. En un momento confirmaremos la preparación y el tiempo estimado de entrega.</p>
    <a href="index.html" class="btn-return">
      <i class="fas fa-utensils"></i> Volver al Menú
    </a>
  </div>

</body>
</html>
